name: Zabon Blog Config
version: 1.0.0
schema: v1

models:
  # 1. Qwen3.5-27B via OpenRouter (Recommended for Chat, Edit, Apply)
  - name: Qwen3.5-27B
    provider: openrouter
    model: qwen/Qwen3.5-27B
    apiKey: ***REMOVED-OPENROUTER-KEY***
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 131072
      maxTokens: 8192
    capabilities:
      - tool_use

  # 2. (Optional) Keep a small local model for autocomplete only, if you have Ollama running
  # - name: Qwen 2.5 Coder 7B Local
  #   provider: ollama
  #   model: qwen2.5-coder:7b
  #   roles:
  #     - autocomplete

  # 3. (Optional) A fallback model like Claude or GPT if needed
