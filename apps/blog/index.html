<!doctype html>
<html lang="en" data-theme="auto" data-lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Zabon Blog — coming soon" />
    <meta name="robots" content="noindex" />
    <title>Zabon Blog — Under Construction</title>

    <style>
      /* =========================================================
       Design tokens (shared with the rest of the Zabon site)
       ========================================================= */
      :root {
        --bg: #ffffff;
        --surface: #f5f5f7;
        --surface-2: #ffffff;
        --text: #1c1c1e;
        --text-muted: #6b6b70;
        --border: #e0e0e5;
        --accent: #2b6cb0;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        --radius: 14px;
        --toolbar-h: 56px;
        --transition: 220ms ease;
      }

      html[data-theme="night"] {
        --bg: #111214;
        --surface: #1c1d20;
        --surface-2: #232427;
        --text: #f2f2f4;
        --text-muted: #9a9aa0;
        --border: #2e2f33;
        --accent: #6aa9ff;
        --shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }

      /* ---------- Reset ---------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Noto Sans Myanmar",
          "Myanmar Text",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        transition:
          background var(--transition),
          color var(--transition);
      }

      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }

      /* ---------- Toolbar ---------- */
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 12px;
        height: var(--toolbar-h);
        padding: 0 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      .toolbar__title {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: 0.2px;
      }

      .toolbar__title-link {
        color: inherit;
        text-decoration: none;
        border-radius: 6px;
        padding: 4px 6px;
        margin: -4px -6px;
        transition:
          background var(--transition),
          color var(--transition);
      }
      .toolbar__title-link:hover,
      .toolbar__title-link:focus-visible {
        background: var(--surface-2);
        color: var(--accent);
        outline: none;
      }

      .toolbar__spacer {
        flex: 1;
      }

      /* Home button */
      .toolbar__home-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        font-size: 1.4rem;
        line-height: 1;
        transition:
          background var(--transition),
          color var(--transition);
      }
      .toolbar__home-btn:hover,
      .toolbar__home-btn:focus-visible {
        background: var(--surface-2);
        color: var(--accent);
        outline: none;
      }

      /* ---------- Main content ---------- */
      .content {
        padding: 32px 16px 48px;
        max-width: 560px;
        margin: 0 auto;
        text-align: center;
      }

      .uc-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 28px 20px;
      }

      .uc-icon {
        font-size: 3.5rem;
        line-height: 1;
        margin-bottom: 12px;
      }

      .uc-heading {
        margin: 0 0 8px;
        font-size: 1.35rem;
        font-weight: 700;
      }

      .uc-text {
        margin: 0 0 20px;
        color: var(--text-muted);
        line-height: 1.5;
        font-size: 0.95rem;
      }

      .uc-divider {
        height: 1px;
        background: var(--border);
        margin: 20px 0;
      }

      .uc-langs {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .uc-lang {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      .uc-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
        transition:
          transform var(--transition),
          opacity var(--transition);
      }
      .uc-btn:hover,
      .uc-btn:focus-visible {
        transform: translateY(-1px);
        opacity: 0.95;
        outline: none;
      }

      /* ---------- Larger screens ---------- */
      @media (min-width: 600px) {
        .content {
          padding: 48px 24px 64px;
        }
        .uc-card {
          padding: 40px 32px;
        }
        .uc-heading {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- ===== App Toolbar ===== -->
    <header class="toolbar" role="banner">
      <h1 class="toolbar__title">
        <a class="toolbar__title-link" href="../../">Zabon</a>
      </h1>
      <span class="toolbar__spacer" aria-hidden="true"></span>
      <a
        class="toolbar__home-btn"
        href="../../"
        aria-label="Return to Zabon home"
        title="Home"
        >⌂</a
      >
    </header>

    <!-- ===== Main content ===== -->
    <main class="content" role="main">
      <div class="uc-card">
        <div class="uc-icon" aria-hidden="true">🚧</div>

        <h2 class="uc-heading">Blog Coming Soon</h2>

        <p class="uc-text">
          The Zabon Blog is under construction. Articles about language
          learning, grammar tips, and study strategies will appear here.
        </p>

        <div class="uc-divider" role="presentation"></div>

        <div class="uc-langs" aria-label="Planned languages">
          <span class="uc-lang">🇬🇧 English</span>
          <span class="uc-lang">🇮🇷 فارسی</span>
          <span class="uc-lang">🇹🇭 ไทย</span>
          <span class="uc-lang">🇸🇦 العربية</span>
          <span class="uc-lang">🇲🇲 မြန်မာ</span>
        </div>

        <a class="uc-btn" href="../../">
          <span aria-hidden="true">←</span>
          <span>Back to Zabon</span>
        </a>
      </div>
    </main>

    <script>
      /* =========================================================
       Minimal theme handling: follow OS preference, remember
       the user's choice from the main site if available.
       ========================================================= */
      (function () {
        "use strict";

        const html = document.documentElement;
        const media = window.matchMedia("(prefers-color-scheme: dark)");

        function stored() {
          try {
            return localStorage.getItem("zabon.theme") || "auto";
          } catch {
            return "auto";
          }
        }

        function resolved(mode) {
          if (mode === "auto") return media.matches ? "night" : "day";
          return mode;
        }

        function apply(mode) {
          html.setAttribute("data-theme", resolved(mode));
          html.setAttribute("data-theme-mode", mode);
        }

        apply(stored());

        media.addEventListener("change", () => {
          if (html.getAttribute("data-theme-mode") === "auto") apply("auto");
        });
      })();
    </script>
  </body>
</html>
