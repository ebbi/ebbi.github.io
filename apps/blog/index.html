<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zabon Blog</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#/en">Zabon Blog</a>

      <nav id="lang-nav" aria-label="Language">
        <label class="visually-hidden" for="lang-select">Language</label>
        <span class="lang-flag" aria-hidden="true"></span>
        <select id="lang-select" class="lang-select" data-lang="en">
          <option value="en">English</option>
          <option value="fa">فارسی</option>
          <option value="ar">العربية</option>
          <option value="th">ไทย</option>
        </select>
      </nav>
    </header>

    <!-- Container the JS renders into -->
    <main id="app"></main>
    <footer>
      <p>&copy; 2024 Zabon Blog. Built with Vanilla JS.</p>
    </footer>

    <!-- Scripts load after the HTML elements; order matters:
         renderer (used by app), router (drives route events), nav (switcher,
         reads router.currentRoute), app (controller, last; calls nav.init). -->
    <script src="assets/js/renderer.js"></script>
    <script src="assets/js/router.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
