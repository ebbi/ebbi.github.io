<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zabon Blog</title>
    <!-- Milestone 07b: theme.js is loaded here (and NOT deferred) so its
         parse-time application of the persisted theme runs BEFORE first
         paint, avoiding a flash of the wrong theme (T-3). No inline script;
         the pre-paint apply lives in the external module (single source). -->
    <script src="assets/js/theme.js"></script>
    <!-- Milestone 07c: font.js is loaded here (and NOT deferred) for the SAME
         reason — its parse-time application of the persisted/default font
         family runs BEFORE first paint, avoiding a flash of the wrong font
         (F-3). No inline script; font.js is the single source of the font
         early apply, coordinated with theme.js (two external head modules,
         each owning its own early apply). -->
    <script src="assets/js/font.js"></script>
    <!-- Milestone 11c: lang.js is loaded here (NOT deferred), alongside
         theme.js/font.js, the sibling pre-controller head modules. It owns
         the persisted language choice (ONE localStorage key) and has NO
         parse-time side effect; router.js (loaded in the body) is the ONLY
         module that consults/writes it. It MUST precede router.js in load
         order so window.BlogLang exists when the router first resolves. -->
    <script src="assets/js/lang.js"></script>
    <!-- Milestone 11-ui-i18n (D-11i-2): i18n.js is loaded here (NOT deferred),
         AFTER lang.js, the sibling pre-controller head module. It owns the
         chrome-string DICTIONARY (en/fa/th/ar) + the data-i18n apply() pass.
         It has NO parse-time side effect: app.js calls setLang(route.lang) +
         apply(document) on every route change. Loaded pre-controller so
         window.BlogI18n exists before app.js runs. -->
    <script src="assets/js/i18n.js"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- Fixed top toolbar: title links home; hamburger opens the drawer (S-8). -->
    <header class="app-bar app-bar--top">
      <!-- Milestone 11c (D-11c-4): the brand links home with a
           LANGUAGE-NEUTRAL target ("#/") so it returns to the index in the
           CURRENT language instead of forcing EN. router.js resolves the
           silent "#/" to the persisted/current language. -->
      <a class="brand" href="#/" data-i18n="brand.title">Zabon Blog</a>
      <button
        id="menu-btn"
        class="app-bar__menu-btn"
        type="button"
        aria-label="Open menu"
        data-i18n-aria="aria-label"
        data-i18n-key="menu.open"
        aria-expanded="false"
        aria-controls="app-panel"
      >
        <span class="hamburger" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
    </header>

    <!-- Side-panel drawer (overlay at ALL widths; S-1). The Settings panel
         (07) hosts the moved language switcher and, since 07b, the theme
         control. aria-hidden toggled by shell.js (S-8). -->
    <aside id="app-panel" class="app-panel" aria-hidden="true">
      <div class="app-panel__backdrop" data-close></div>
      <div
        class="app-panel__content"
        role="dialog"
        aria-modal="true"
        aria-label="Menu"
        data-i18n-aria="aria-label"
        data-i18n-key="drawer.menu"
      >
        <div class="app-panel__header">
          <h2 data-i18n="drawer.menu">Menu</h2>
          <button
            id="panel-close"
            class="app-panel__close"
            type="button"
            aria-label="Close menu"
            data-i18n-aria="aria-label"
            data-i18n-key="menu.close"
            data-close
          >
            &times;
          </button>
        </div>

        <nav
          id="lang-nav"
          class="app-panel__section"
          aria-label="Language"
          data-i18n-aria="aria-label"
          data-i18n-key="drawer.language"
        >
          <label
            class="visually-hidden"
            for="lang-select"
            data-i18n="drawer.language"
            >Language</label
          >
          <span class="lang-flag" aria-hidden="true"></span>
          <select id="lang-select" class="lang-select" data-lang="en">
            <option value="en">English</option>
            <option value="fa">فارسی</option>
            <option value="ar">العربية</option>
            <option value="th">ไทย</option>
          </select>
        </nav>

        <!-- Milestone 07b: Theme control (Light / Dark / Auto) — the Settings
             panel. A native <select> with an associated visually-hidden label;
             wired by theme.js (window.BlogTheme.init). -->
        <nav
          id="theme-nav"
          class="app-panel__section"
          aria-label="Theme"
          data-i18n-aria="aria-label"
          data-i18n-key="drawer.theme"
        >
          <label
            class="visually-hidden"
            for="theme-select"
            data-i18n="drawer.theme"
            >Theme</label
          >
          <span class="theme-icon" aria-hidden="true">◐</span>
          <select id="theme-select" class="theme-select">
            <option value="light" data-i18n="theme.light">Light</option>
            <option value="dark" data-i18n="theme.dark">Dark</option>
            <option value="auto" data-i18n="theme.auto">Auto</option>
          </select>
        </nav>

        <!-- Milestone 07c: Font control (Default / Traditional / Modern) — the
             Settings panel, peer of #theme-nav and #lang-nav. A native <select>
             with an associated visually-hidden label; wired by font.js
             (window.BlogFont.init). The empty value is the DEFAULT book-reader
             base (no data-font attribute -> CSS :root default). -->
        <nav
          id="font-nav"
          class="app-panel__section"
          aria-label="Font"
          data-i18n-aria="aria-label"
          data-i18n-key="drawer.font"
        >
          <label
            class="visually-hidden"
            for="font-select"
            data-i18n="drawer.font"
            >Font</label
          >
          <span class="font-icon" aria-hidden="true">A</span>
          <select id="font-select" class="font-select">
            <option value="" data-i18n="font.default">Default</option>
            <option value="traditional" data-i18n="font.traditional">
              Traditional
            </option>
            <option value="modern" data-i18n="font.modern">Modern</option>
          </select>
        </nav>
      </div>
    </aside>

    <!-- Container the JS renders into. Inset by the fixed bars (S-1). -->
    <main id="app"></main>

    <!-- Fixed bottom toolbar: transport buttons drive TTS on the post view
         (Milestone TTS). They start inert and app.js enables Play when a
         post is rendered; the list view keeps all three inert (X-3/X-6). -->
    <footer class="app-bar app-bar--bottom">
      <div
        class="transport"
        role="group"
        aria-label="Playback"
        data-i18n-aria="aria-label"
        data-i18n-key="toolbar.playback"
      >
        <button
          id="tts-play-btn"
          class="transport__btn"
          type="button"
          disabled
          aria-label="Play"
          data-i18n-aria="aria-label"
          data-i18n-key="toolbar.play"
        >
          <span aria-hidden="true">▶</span>
        </button>
        <button
          id="tts-pause-btn"
          class="transport__btn"
          type="button"
          disabled
          aria-label="Pause"
          data-i18n-aria="aria-label"
          data-i18n-key="toolbar.pause"
        >
          <span aria-hidden="true">⏸</span>
        </button>
        <button
          id="tts-stop-btn"
          class="transport__btn"
          type="button"
          disabled
          aria-label="Stop"
          data-i18n-aria="aria-label"
          data-i18n-key="toolbar.stop"
        >
          <span aria-hidden="true">⏹</span>
        </button>

        <!-- Milestone 12 (D-12-8): the settings toggle (gear) opens the
             SPEED + PITCH + VOICE popover. aria-expanded/aria-controls +
             the `hidden` attribute (10b convention); speech-settings.js
             wires it. -->
        <button
          id="tts-settings-btn"
          class="transport__btn transport__btn--icon"
          type="button"
          aria-label="Playback settings"
          data-i18n-aria="aria-label"
          data-i18n-key="toolbar.settings"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="tts-settings"
        >
          <span aria-hidden="true">⚙</span>
        </button>

        <!-- Milestone 12 (D-12-4): the LANGUAGE icon. Same language set as
             the drawer switcher; items carry data-href built by app.js using
             BlogNav.buildLangHref semantics (single source). -->
        <button
          id="tts-lang-btn"
          class="transport__btn transport__btn--icon"
          type="button"
          aria-label="Language"
          data-i18n-aria="aria-label"
          data-i18n-key="lang.aria"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="tts-lang-menu"
          data-lang="en"
        >
          <span aria-hidden="true">🌐</span>
        </button>
        <ul
          id="tts-lang-menu"
          class="tts-popover tts-lang-menu"
          role="listbox"
          aria-label="Language"
          data-i18n-aria="aria-label"
          data-i18n-key="lang.aria"
          hidden
        >
          <li>
            <button
              class="tts-lang-menu__item"
              type="button"
              role="option"
              data-lang="en"
              hreflang="en"
            >
              English
            </button>
          </li>
          <li>
            <button
              class="tts-lang-menu__item"
              type="button"
              role="option"
              data-lang="fa"
              hreflang="fa"
            >
              فارسی
            </button>
          </li>
          <li>
            <button
              class="tts-lang-menu__item"
              type="button"
              role="option"
              data-lang="th"
              hreflang="th"
            >
              ไทย
            </button>
          </li>
          <li>
            <button
              class="tts-lang-menu__item"
              type="button"
              role="option"
              data-lang="ar"
              hreflang="ar"
            >
              العربية
            </button>
          </li>
        </ul>

        <!-- Milestone 12 (D-12-5): the FONT icon cycles Default/Traditional/
             Modern via BlogFont.set (font.js remains the single owner). -->
        <button
          id="tts-font-btn"
          class="transport__btn transport__btn--icon"
          type="button"
          aria-label="Cycle reading font"
          data-i18n-aria="aria-label"
          data-i18n-key="toolbar.cyclingFont"
        >
          <span aria-hidden="true">A</span>
        </button>
      </div>

      <!-- Milestone 12 (D-12-1/2/3): the SPEED + PITCH + VOICE popover,
           toggled by #tts-settings-btn. Uses the `hidden` attribute (10b
           convention); speech-settings.js populates + wires it. -->
      <div id="tts-settings" class="tts-popover tts-settings" hidden>
        <label class="tts-settings__row" for="tts-rate-select">
          <span class="tts-settings__label" data-i18n="settings.speed"
            >Speed</span
          >
          <select id="tts-rate-select" class="tts-settings__select">
            <option value="0.6" data-i18n="speed.slower">Slower</option>
            <option value="0.8" data-i18n="speed.slow">Slow</option>
            <option value="1" selected data-i18n="speed.normal">Normal</option>
            <option value="1.25" data-i18n="speed.fast">Fast</option>
            <option value="1.6" data-i18n="speed.faster">Faster</option>
          </select>
        </label>
        <label class="tts-settings__row" for="tts-rate-range">
          <span class="tts-settings__label" data-i18n="settings.fine"
            >Fine</span
          >
          <input
            id="tts-rate-range"
            class="tts-settings__range"
            type="range"
            min="0.5"
            max="2"
            step="0.05"
            value="1"
            aria-label="Playback speed"
            data-i18n-aria="aria-label"
            data-i18n-key="settings.playbackSpeedAria"
          />
        </label>

        <fieldset class="tts-settings__fieldset">
          <legend class="tts-settings__label" data-i18n="settings.pitch">
            Pitch
          </legend>
          <div class="tts-settings__pitch-modes">
            <label class="tts-settings__pitch-option">
              <input
                id="tts-pitch-mode"
                type="radio"
                name="tts-pitch-mode"
                value="auto"
                checked
              />
              <span data-i18n="settings.naturalPitch">Natural pitch</span>
            </label>
            <label class="tts-settings__pitch-option">
              <input
                id="tts-pitch-mode-manual"
                type="radio"
                name="tts-pitch-mode"
                value="manual"
              />
              <span data-i18n="settings.manual">Manual</span>
            </label>
          </div>
          <input
            id="tts-pitch-range"
            class="tts-settings__range"
            type="range"
            min="0.5"
            max="1.5"
            step="0.05"
            value="1"
            disabled
            aria-label="Speech pitch (manual)"
            data-i18n-aria="aria-label"
            data-i18n-key="settings.speechPitchAria"
          />
        </fieldset>

        <label class="tts-settings__row" for="tts-voice-select">
          <span class="tts-settings__label" data-i18n="settings.voice"
            >Voice</span
          >
          <select id="tts-voice-select" class="tts-settings__select">
            <option value="" data-i18n="settings.defaultVoice">
              Default voice
            </option>
          </select>
        </label>
        <button
          id="tts-test-btn"
          class="tts-settings__test"
          type="button"
          data-i18n="settings.testVoice"
        >
          Test voice
        </button>
      </div>
    </footer>

    <!-- Scripts load after the HTML elements; order matters:
         renderer (used by app), router (drives route events), nav (switcher,
         reads router.currentRoute), shell (drawer; no router dependency),
         tts (transport buttons; no router dependency),
         speech-settings (Milestone 12: speed/pitch/voice prefs + controls;
         reads/writes localStorage, no router dependency; must load AFTER tts
         so tts.js can read its settings), app (controller, last; calls
         nav.init + shell.init + theme.init + font.init + tts.init +
         speech.init).
         theme.js and font.js are ALREADY loaded in <head> (pre-paint apply);
         the app.js guards wire their controls. They are not re-loaded here. -->
    <script src="assets/js/renderer.js"></script>
    <script src="assets/js/router.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/tts.js"></script>
    <script src="assets/js/speech-settings.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
